apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apisix-gateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/tu-usuario/mi-repo-apisix.git'
    targetRevision: HEAD
    path: manifests
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: ingress-apisix
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
