# CRDs oficiales de APISIX Ingress Controller
# Descarga y copia los CRDs oficiales desde:
# https://github.com/apache/apisix-ingress-controller/tree/master/samples/deploy/crd/v1
# A modo de ejemplo se incluye un CRD placeholder para ApisixRoute.

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: apisixroutes.apisix.apache.org
spec:
  group: apisix.apache.org
  versions:
    - name: v2
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              description: "Definición de la configuración de ApisixRoute"
  scope: Namespaced
  names:
    plural: apisixroutes
    singular: apisixroute
    kind: ApisixRoute
    shortNames:
    - ar

# (Agrega aquí los otros CRDs necesarios para ApisixUpstream, ApisixConsumer, etc.)
